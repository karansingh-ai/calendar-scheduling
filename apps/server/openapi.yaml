openapi: 3.1.0
info:
  title: Timebook API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    REST API for Timebook, open-source scheduling for teams.

    **Authentication.** Private endpoints (`/api/v1/*`) accept either the browser session cookie or a
    personal API key: `Authorization: Bearer sk_...` (create one under Settings > API keys).
    Public booking endpoints (`/api/public/*`) need no authentication and are rate limited per IP.

    **Errors** use `{ "error": { "code", "message", "details"? } }` with a matching HTTP status.

    **Times** are ISO 8601 with an offset (`2026-12-07T15:00:00Z`). Time zones are IANA names.

    **Webhooks** are POSTed as JSON with headers `x-webhook-event`, `x-webhook-id` and
    `x-webhook-signature: t=<unix seconds>,v1=<hex HMAC-SHA256(secret, "<t>.<raw body>")>`.
    Failed deliveries are retried with exponential backoff (8 attempts).
servers:
  - url: /api
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Personal API key (sk_...)
    session:
      type: apiKey
      in: cookie
      name: timebook_session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: slot_unavailable }
            message: { type: string }
            details: { type: array, items: { type: object, properties: { path: { type: string }, message: { type: string } } } }
    Slot:
      type: object
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        hostIds: { type: array, items: { type: string, format: uuid }, description: Only on authenticated slot queries }
        seatsRemaining: { type: integer, description: Group events only }
    Invitee:
      type: object
      required: [name, email, timezone]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        timezone: { type: string, example: Europe/Paris }
    Location:
      type: object
      properties:
        type: { type: string, enum: [google_meet, microsoft_teams, link, phone, in_person, custom] }
        value: { type: string }
        joinUrl: { type: string }
    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [confirmed, cancelled] }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        eventType: { type: object, properties: { id: { type: string }, slug: { type: string }, title: { type: string }, kind: { type: string } } }
        hostUserId: { type: string, format: uuid }
        hosts: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, email: { type: string } } } }
        location: { $ref: "#/components/schemas/Location" }
        invitee: { $ref: "#/components/schemas/Invitee" }
        answers: { type: object, additionalProperties: true }
        assignmentReason: { type: [string, "null"], description: Why round robin picked this host }
        cancelReason: { type: [string, "null"] }
        cancelledBy: { type: [string, "null"], enum: [host, invitee, admin, null] }
        rescheduledFromId: { type: [string, "null"] }
        noShow: { type: boolean }
        createdAt: { type: string, format: date-time }
    EventTypeInput:
      type: object
      properties:
        title: { type: string }
        slug: { type: string, pattern: "^[a-z0-9-]+$" }
        description: { type: string }
        kind: { type: string, enum: [one_on_one, group, collective, round_robin] }
        teamId: { type: [string, "null"], format: uuid, description: Create a team event type (team managers and admins) }
        durationMinutes: { type: integer, minimum: 5, maximum: 720 }
        slotIntervalMinutes: { type: [integer, "null"] }
        bufferBeforeMinutes: { type: integer }
        bufferAfterMinutes: { type: integer }
        minimumNoticeMinutes: { type: integer }
        bookingWindow:
          oneOf:
            - { type: "null" }
            - { type: object, properties: { type: { const: rolling }, days: { type: integer } } }
            - { type: object, properties: { type: { const: range }, start: { type: string, format: date }, end: { type: string, format: date } } }
        dailyLimit: { type: [integer, "null"] }
        weeklyLimit: { type: [integer, "null"] }
        seats: { type: [integer, "null"], description: Required for group events }
        location: { $ref: "#/components/schemas/Location" }
        questions:
          type: array
          items: { type: object, properties: { id: { type: string }, label: { type: string }, type: { type: string, enum: [text, textarea, phone, select, checkbox] }, required: { type: boolean }, options: { type: array, items: { type: string } } } }
        reminderMinutes: { type: array, items: { type: integer }, example: [1440, 60] }
        rrStrategy: { type: string, enum: [maximize_availability, equal_distribution] }
        rrMaxImbalance: { type: [integer, "null"] }
        redirectUrl: { type: [string, "null"], format: uri }
        color: { type: string, example: "#2563eb" }
        hidden: { type: boolean }
        active: { type: boolean }
        hosts:
          type: array
          items: { type: object, required: [userId], properties: { userId: { type: string, format: uuid }, priority: { type: integer, minimum: 0, maximum: 10 }, weight: { type: integer, minimum: 1 }, scheduleId: { type: [string, "null"], format: uuid } } }
    Schedule:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        weekly: { type: array, items: { type: object, properties: { day: { type: integer, minimum: 1, maximum: 7, description: "ISO weekday, Monday = 1" }, ranges: { type: array, items: { type: object, properties: { start: { type: string, example: "09:00" }, end: { type: string, example: "17:00" } } } } } } }
        overrides: { type: array, items: { type: object, properties: { date: { type: string, format: date }, ranges: { type: array, items: { type: object } } } } }
        isDefault: { type: boolean }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
security:
  - apiKey: []
  - session: []
paths:
  /public/users/{username}/event-types/{slug}:
    get:
      tags: [Public]
      summary: Public event type for a person's booking page
      security: []
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Event type and org branding }, "404": { $ref: "#/components/responses/Error" } }
  /public/teams/{teamSlug}/event-types/{slug}:
    get:
      tags: [Public]
      summary: Public team event type
      security: []
      parameters:
        - { name: teamSlug, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Event type and org branding } }
  /public/event-types/{id}/slots:
    get:
      tags: [Public]
      summary: Available start times
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time }, description: At most 62 days after start }
      responses:
        "200": { description: Slots, content: { application/json: { schema: { type: object, properties: { slots: { type: array, items: { $ref: "#/components/schemas/Slot" } } } } } } }
  /public/event-types/{id}/bookings:
    post:
      tags: [Public]
      summary: Book a slot
      description: Availability is re-checked atomically; returns 409 `slot_unavailable` if someone else took it.
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [start, invitee], properties: { start: { type: string, format: date-time }, invitee: { $ref: "#/components/schemas/Invitee" }, answers: { type: object, additionalProperties: true } } }
      responses:
        "201": { description: Booked. `manageToken` lets the invitee view, reschedule and cancel., content: { application/json: { schema: { type: object, properties: { booking: { $ref: "#/components/schemas/Booking" }, manageToken: { type: string }, redirectUrl: { type: [string, "null"] } } } } } }
        "409": { $ref: "#/components/responses/Error" }
  /public/bookings/{id}:
    get:
      tags: [Public]
      summary: View a booking with its manage token
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: Booking } }
  /public/bookings/{id}/cancel:
    post:
      tags: [Public]
      summary: Cancel as the invitee
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string }, reason: { type: string } } } } } }
      responses: { "200": { description: Cancelled } }
  /public/bookings/{id}/reschedule:
    post:
      tags: [Public]
      summary: Reschedule as the invitee (creates a new booking and cancels the old one)
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [token, start], properties: { token: { type: string }, start: { type: string, format: date-time }, reason: { type: string } } } } } }
      responses: { "201": { description: New booking and new manage token } }
  /v1/me:
    get: { tags: [Account], summary: Current user, responses: { "200": { description: User } } }
    patch: { tags: [Account], summary: Update profile (name, username, timezone, welcomeMessage), responses: { "200": { description: User } } }
  /v1/users:
    get: { tags: [Account], summary: Directory of active users (for picking hosts), responses: { "200": { description: Users } } }
  /v1/event-types:
    get:
      tags: [Event types]
      summary: Event types you own, host or can see through a team
      parameters: [{ name: scope, in: query, schema: { type: string, enum: [mine, all] }, description: "all: every event type (admins)" }]
      responses: { "200": { description: Event types } }
    post:
      tags: [Event types]
      summary: Create an event type
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/EventTypeInput" } } } }
      responses: { "201": { description: Created }, "409": { $ref: "#/components/responses/Error" } }
  /v1/event-types/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Event types], summary: Get an event type, responses: { "200": { description: Event type } } }
    patch:
      tags: [Event types]
      summary: Update an event type (partial)
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/EventTypeInput" } } } }
      responses: { "200": { description: Updated } }
    delete: { tags: [Event types], summary: Delete (soft) an event type; bookings are kept, responses: { "200": { description: Deleted } } }
  /v1/event-types/{id}/slots:
    get:
      tags: [Event types]
      summary: Slots with host ids; add debug=true for per-host reasons each candidate was blocked
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: debug, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Slots and optional explanations. Reasons include PAST, MINIMUM_NOTICE, OUTSIDE_BOOKING_WINDOW, OUTSIDE_WORKING_HOURS, BUSY, BUFFER_CONFLICT, DAILY_LIMIT, WEEKLY_LIMIT, FULL, FAIRNESS.
  /v1/schedules:
    get: { tags: [Availability], summary: Your availability schedules, responses: { "200": { description: Schedules } } }
    post:
      tags: [Availability]
      summary: Create a schedule
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } } }
      responses: { "201": { description: Created } }
  /v1/schedules/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch: { tags: [Availability], summary: Update a schedule, responses: { "200": { description: Updated } } }
    delete: { tags: [Availability], summary: Delete a non-default schedule, responses: { "200": { description: Deleted } } }
  /v1/bookings:
    get:
      tags: [Bookings]
      summary: List bookings you host (admins can use scope=org)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [upcoming, past, cancelled, all] } }
        - { name: scope, in: query, schema: { type: string, enum: [mine, org] } }
        - { name: eventTypeId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { "200": { description: "{ bookings, total }" } }
    post:
      tags: [Bookings]
      summary: Book on someone's behalf (same rules as the public page)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [eventTypeId, start, invitee], properties: { eventTypeId: { type: string, format: uuid }, start: { type: string, format: date-time }, invitee: { $ref: "#/components/schemas/Invitee" }, answers: { type: object } } }
      responses: { "201": { description: Booking and manageUrl } }
  /v1/bookings/{id}:
    get: { tags: [Bookings], summary: Booking detail, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: Booking } } }
  /v1/bookings/{id}/cancel:
    post: { tags: [Bookings], summary: Cancel as host or admin, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: Cancelled } } }
  /v1/bookings/{id}/reschedule:
    post: { tags: [Bookings], summary: Move to a new start time, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "201": { description: New booking } } }
  /v1/bookings/{id}/no-show:
    post: { tags: [Bookings], summary: Mark or unmark an invitee no-show, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: Updated } } }
  /v1/calendars:
    get: { tags: [Calendars], summary: Connected calendar accounts and their calendars, responses: { "200": { description: Connections } } }
  /v1/calendars/{id}:
    patch: { tags: [Calendars], summary: Toggle checkConflicts / isDestination, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /v1/calendar-connections/ics:
    post: { tags: [Calendars], summary: Add a read-only ICS feed (url, name), responses: { "201": { description: Connected } } }
  /v1/calendar-connections/{id}:
    delete: { tags: [Calendars], summary: Disconnect, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /v1/webhooks:
    get: { tags: [Webhooks], summary: List webhooks, responses: { "200": { description: Webhooks } } }
    post:
      tags: [Webhooks]
      summary: Create a webhook (returns the signing secret once)
      requestBody: { content: { application/json: { schema: { type: object, required: [url, events], properties: { url: { type: string, format: uri }, events: { type: array, items: { type: string, enum: [booking.created, booking.rescheduled, booking.cancelled] } }, scope: { type: string, enum: [user, org] } } } } } }
      responses: { "201": { description: Webhook and secret } }
  /v1/webhooks/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch: { tags: [Webhooks], summary: Update url, events or active, responses: { "200": { description: OK } } }
    delete: { tags: [Webhooks], summary: Delete, responses: { "200": { description: OK } } }
  /v1/webhooks/{id}/deliveries:
    get: { tags: [Webhooks], summary: Last 50 deliveries, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Deliveries } } }
  /v1/webhooks/{id}/test:
    post: { tags: [Webhooks], summary: Send a signed ping now, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Result } } }
  /v1/api-keys:
    get: { tags: [Account], summary: List your API keys, responses: { "200": { description: Keys } } }
    post: { tags: [Account], summary: Create an API key (browser session only; secret shown once), security: [{ session: [] }], responses: { "201": { description: Key and secret } } }
  /v1/api-keys/{id}:
    delete: { tags: [Account], summary: Revoke, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /v1/teams:
    get: { tags: [Teams], summary: List teams with members, responses: { "200": { description: Teams } } }
    post: { tags: [Teams], summary: Create a team (admins), responses: { "201": { description: Team } } }
  /v1/teams/{id}/members:
    put: { tags: [Teams], summary: Replace team members (admins and team managers), parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Team } } }
  /v1/admin/users:
    get: { tags: [Admin], summary: List users, responses: { "200": { description: Users } } }
    post: { tags: [Admin], summary: Invite a user (returns inviteUrl), responses: { "201": { description: User and invite link } } }
  /v1/admin/users/{id}:
    patch: { tags: [Admin], summary: Change role, disable or rename, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: User } } }
  /v1/admin/audit:
    get: { tags: [Admin], summary: Audit log (newest first; paginate with before), responses: { "200": { description: Entries } } }
  /v1/admin/audit.csv:
    get: { tags: [Admin], summary: Audit log CSV export, responses: { "200": { description: CSV } } }
  /v1/admin/org:
    get: { tags: [Admin], summary: Organization branding, responses: { "200": { description: Org } } }
    patch: { tags: [Admin], summary: Update name, brandColor, logoUrl, responses: { "200": { description: Org } } }
