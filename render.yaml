# One-click deploy on Render: the app plus a PostgreSQL database, both on the free plan.
# "Deploy to Render" in the README opens this Blueprint. Spec: https://render.com/docs/blueprint-spec
#
# Free plan limits: the web service sleeps after 15 idle minutes (the first request wakes it in about a
# minute, and reminder emails wait until it is awake), and a free Render Postgres database expires after
# 30 days. For a longer-lived free setup, point DATABASE_URL at a free Neon or Supabase database instead.
services:
  - type: web
    name: scheduler
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scheduler-db
          property: connectionString
      # Encrypts calendar tokens and webhook secrets. Generated once; keep it stable.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: APP_NAME
        value: Scheduler
      # APP_URL defaults to the service's onrender.com address. Set it when you add a custom domain.
      # Optional, filled in on the Render dashboard (leave blank to skip):
      - key: SMTP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: scheduler-db
    plan: free
    databaseName: scheduler
    user: scheduler
    # Only reachable from your Render services, not the internet.
    ipAllowList: []
